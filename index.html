    // ============================================
    // DAILY UNLOCK CONFIGURATION
    // ============================================
    // Set this to the launch date (YYYY, MM (1-12), DD format)
    // Games unlock one per day starting from this date
    // Day 1 = Game #1, Day 2 = Games #1-2, etc.
    const START_YEAR = 2025;
    const START_MONTH = 2; // 1 = January, 2 = February, etc.
    const START_DAY = 4;   // Day of month
    
    // Calculate how many games are unlocked based on current date
    const getUnlockedGameCount = () => {
      const start = new Date(START_YEAR, START_MONTH - 1, START_DAY); // Month is 0-indexed
      const today = new Date();
      // Reset time portions to compare just dates
      start.setHours(0, 0, 0, 0);
      today.setHours(0, 0, 0, 0);
      const diffTime = today - start;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      // Day 0 (launch day) = 1 game, Day 1 = 2 games, etc.
      return Math.max(0, diffDays + 1);
    };

      if (!guessCount || guessCount === null) return 'F';
      switch (guessCount) {
        case 1: return 'A+';
        case 2: return 'A';
        case 3: return 'B';
        case 4: return 'B-';
        case 5: return 'C';
        case 6: return 'D';
        default: return 'F';
      }

    const getGradeColors = (grade) => {

      const gradeValues = { 'A+': 7, 'A': 6, 'B': 5, 'B-': 4, 'C': 3, 'D': 2, 'F': 1 };
      const valueToGrade = { 7: 'A+', 6: 'A', 5: 'B', 4: 'B-', 3: 'C', 2: 'D', 1: 'F' };
      
      let totalValue = 0;
      let count = 0;
      
      // Add wins
      Object.entries(stats.winDistribution).forEach(([guessNum, wins]) => {
        if (wins > 0) {
          const grade = getGrade(parseInt(guessNum));
          totalValue += gradeValues[grade] * wins;
          count += wins;
        }
      });
      
      // Add losses
      if (stats.gamesLost > 0) {
        totalValue += gradeValues['F'] * stats.gamesLost;
        count += stats.gamesLost;
      }
      
      if (count === 0) return null;
      
      const avgValue = Math.round(totalValue / count);
      return valueToGrade[avgValue] || 'C';
    };

                    setIsPlaying(true);
                  }, 500);
                }
              },
              onStateChange: (event) => {
                if (event.data === window.YT.PlayerState.PLAYING) {
                  setIsPlaying(true);
                } else if (event.data === window.YT.PlayerState.PAUSED || event.data === window.YT.PlayerState.ENDED) {
                  setIsPlaying(false);
                }
              },
              onError: (event) => {
                console.error('YouTube player error:', event);
                setSearchError('Error loading audio. Please try refreshing the page.');
              }
            }
          });
        }
      }, [showVideo, currentSong, gameWon, itunesError]);

      const searchSongs = async (query) => {
        if (!query || query.length < 2) {
          setSuggestions([]);
          return;
        }

        try {
          const searchQuery = encodeURIComponent(query);
          const response = await fetch(
            `https://itunes.apple.com/search?term=${searchQuery}&media=music&entity=song&limit=10`
          );

          if (response.ok) {
            const data = await response.json();
            if (data.results && data.results.length > 0) {
              let tracks = data.results.map(track => ({
                title: track.trackName,
                artist: track.artistName,
                fullText: `${track.trackName} - ${track.artistName}`
              }));
              
              // Prioritize the correct artist if user typed matching title
              if (currentSong) {
                const queryLower = query.toLowerCase();
                const currentTitleLower = currentSong.title.toLowerCase();
                const currentArtistLower = currentSong.artist.toLowerCase();
                
                // If query matches or is close to the current song title, boost correct artist
                if (currentTitleLower.includes(queryLower) || queryLower.includes(currentTitleLower)) {
                  tracks.sort((a, b) => {
                    const aIsCorrectArtist = a.artist.toLowerCase().includes(currentArtistLower) || 
                                             currentArtistLower.includes(a.artist.toLowerCase());
                    const bIsCorrectArtist = b.artist.toLowerCase().includes(currentArtistLower) || 
                                             currentArtistLower.includes(b.artist.toLowerCase());
                    
                    if (aIsCorrectArtist && !bIsCorrectArtist) return -1;
                    if (!aIsCorrectArtist && bIsCorrectArtist) return 1;
                    return 0;
                  });
                }
              }
              
              setSuggestions(tracks);
            } else {
              searchLocalSongs(query);
            }
          } else {
            searchLocalSongs(query);
          }
        } catch (error) {
          console.error('Error searching iTunes:', error);
          searchLocalSongs(query);
        }
      };

      const searchLocalSongs = (query) => {
        const lowerQuery = query.toLowerCase();
        const matches = SONGS.filter(song => 
          song.title.toLowerCase().includes(lowerQuery) ||
          song.artist.toLowerCase().includes(lowerQuery)
        ).map(song => ({
          title: song.title,
          artist: song.artist,
          fullText: `${song.title} - ${song.artist}`
        }));
        setSuggestions(matches);
      };

      const handleInputChange = (e) => {

      // Update stats when game is won

        setStats(prevStats => {
          const newStats = {
            ...prevStats,

            currentStreak: prevStats.currentStreak + 1,
            maxStreak: Math.max(prevStats.maxStreak, prevStats.currentStreak + 1),
            winDistribution: {
              ...prevStats.winDistribution,
              [numGuesses]: (prevStats.winDistribution[numGuesses] || 0) + 1
            },
            songStats: {
              ...prevStats.songStats,
              [songKey]: {
                completed: true,
                failed: false,
                bestScore: prevStats.songStats[songKey]?.bestScore 
                  ? Math.min(prevStats.songStats[songKey].bestScore, numGuesses)
                  : numGuesses,
                attempts: (prevStats.songStats[songKey]?.attempts || 0) + 1
              }
            }
          };
          saveStats(newStats);
          return newStats;
        });
      };

      // Update stats when game is lost
      const recordLoss = (song) => {
        const songKey = `${song.title} - ${song.artist}`;
        
        setStats(prevStats => {
          const newStats = {
            ...prevStats,
            gamesPlayed: prevStats.gamesPlayed + 1,
            gamesLost: prevStats.gamesLost + 1,
            currentStreak: 0,
            songStats: {
              ...prevStats.songStats,
              [songKey]: {
                ...prevStats.songStats[songKey],
                completed: prevStats.songStats[songKey]?.completed || false,
                failed: prevStats.songStats[songKey]?.completed ? prevStats.songStats[songKey]?.failed : true,
                attempts: (prevStats.songStats[songKey]?.attempts || 0) + 1

          saveStats(newStats);

      const startNewGame = () => {

        // Check if there's an in-progress game
        const savedState = loadGameState();
        if (savedState && savedState.guesses && savedState.guesses.length > 0) {
          // Redirect to the in-progress game
          const inProgressSongIndex = SONGS.findIndex(s =>

          if (inProgressSongIndex !== -1) {

        let availableSongs = SONGS.filter(song =>

        if (availableSongs.length === 0) {

        const randomSong = availableSongs[Math.floor(Math.random() * availableSongs.length)];
        
        setPlayedSongs(prev => [...prev, { title: randomSong.title, artist: randomSong.artist }]);
        
        resetGameState(randomSong);

      // Start a specific song from the archive
      const startSpecificSong = (song) => {
        stopAllAudio();
        
        // Check if this song has an in-progress game
        const savedState = loadGameState();
        const isThisSongInProgress = savedState && 
            savedState.songTitle === song.title && 
            savedState.songArtist === song.artist &&
            savedState.guesses && 
            savedState.guesses.length > 0;
        
        const hasAnyInProgressGame = savedState && 
            savedState.guesses && 
            savedState.guesses.length > 0;
        
        if (isThisSongInProgress) {
          // Restore the in-progress game instead of starting fresh
          console.log('Restoring in-progress game for:', song.title);
          setCurrentSong(song);
          setGuesses(savedState.guesses);
          setGameWon(false);
          setGameLost(false);
          setGuess('');
          setShowHint(false);
          setSuggestions([]);
          setShowSuggestions(false);
          setSearchError(null);
          setShowVideo(false);
          setPlayerReady(false);
          setYtPlayer(null);

          // Restore audio unlocked state based on guess count
          if (savedState.guesses.length >= GUESSES_BEFORE_AUDIO) {

          } else {
            setAudioUnlocked(false);
          }
          
          // Fetch iTunes preview
          fetchItunesPreview(song);
          setGameMode('play');
        } else if (hasAnyInProgressGame) {
          // Different song selected but there's an in-progress game
          // Don't allow starting a new song - redirect to the in-progress one
          const inProgressSongIndex = SONGS.findIndex(s => 
            s.title === savedState.songTitle && s.artist === savedState.songArtist
          );
          if (inProgressSongIndex !== -1) {
            alert(`You have an in-progress game (Game #${inProgressSongIndex + 1}). Please finish it first!`);
            return;
          } else {
            // In-progress song not found in SONGS array (shouldn't happen), clear it
            clearGameState();
            resetGameState(song);
            setGameMode('play');
          }
        } else {
          // No in-progress game, start fresh
          resetGameState(song);
          setGameMode('play');
        }
      };

      // Reset all game state for a new song
      const resetGameState = (song) => {
        setCurrentSong(song);
        setGuess('');
        setGuesses([]);
        setGameWon(false);
        setGameLost(false);
        setAudioUnlocked(false);
        setIsPlaying(false);
        setShowHint(false);
        setSuggestions([]);
        setShowSuggestions(false);
        setSearchError(null);
        setShowVideo(false);
        setPlayerReady(false);
        setYtPlayer(null);
        setShowPictureOverVideo(false);
        
        // Reset iTunes state
        setItunesPreviewUrl(null);
        setItunesError(false);
        
        // Save initial game state (no guesses yet)
        saveGameState({
          songTitle: song.title,
          songArtist: song.artist,
          guesses: []
        });
        
        // Fetch iTunes preview in background
        fetchItunesPreview(song);
      };

      // Go back to menu
      const goToMenu = () => {
        stopAllAudio();
        setGameMode('menu');
        setCurrentSong(null);
      };

      const handleGuess = async () => {
        if (!guess.trim() || gameWon || gameLost) return;

        // Helper function to normalize strings for comparison
        // Removes punctuation, extra spaces, and converts to lowercase
        const normalizeForComparison = (str) => {
          return str.toLowerCase()
            .replace(/[^a-z0-9\s]/g, '') // Remove punctuation and special characters
            .replace(/\s+/g, ' ')         // Collapse multiple spaces
            .trim();
        };

        // Levenshtein distance for fuzzy matching
        const levenshteinDistance = (str1, str2) => {
          const m = str1.length;
          const n = str2.length;
          const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
          
          for (let i = 0; i <= m; i++) dp[i][0] = i;
          for (let j = 0; j <= n; j++) dp[0][j] = j;
          
          for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
              if (str1[i - 1] === str2[j - 1]) {
                dp[i][j] = dp[i - 1][j - 1];
              } else {
                dp[i][j] = 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
              }
            }
          }
          return dp[m][n];
        };

        // Check if two strings are similar enough (allow ~1 error per 10 characters, minimum 2)
        const isSimilarEnough = (str1, str2) => {
          const distance = levenshteinDistance(str1, str2);
          const maxAllowedDistance = Math.max(2, Math.floor(Math.max(str1.length, str2.length) / 10));
          return distance <= maxAllowedDistance;
        };

        const normalizedGuess = normalizeForComparison(guess);
        const normalizedTitle = normalizeForComparison(currentSong.title);
        const normalizedArtist = normalizeForComparison(currentSong.artist);
        
        // Split artist name into words for flexible matching
        const artistWords = normalizedArtist.split(/\s+/).filter(w => w.length > 2);
        
        // Check if guess contains the artist (flexible - matches if most artist words are present)
        const guessContainsArtist = artistWords.length > 0 && 
          artistWords.filter(word => normalizedGuess.includes(word)).length >= Math.ceil(artistWords.length * 0.5);
        
        // Also check for exact artist match or artist as substring
        const artistInGuess = normalizedGuess.includes(normalizedArtist) || guessContainsArtist;

        // Check for exact or fuzzy title match
        const titleMatches = normalizedGuess === normalizedTitle || 
                            isSimilarEnough(normalizedGuess, normalizedTitle);
        
        const titleWithArtistMatches = normalizedGuess === `${normalizedTitle} ${normalizedArtist}` ||
                                       normalizedGuess === `${normalizedArtist} ${normalizedTitle}` ||
                                       isSimilarEnough(normalizedGuess, `${normalizedTitle} ${normalizedArtist}`) ||
                                       isSimilarEnough(normalizedGuess, `${normalizedArtist} ${normalizedTitle}`);

        const isCorrect = titleMatches || 
                          titleWithArtistMatches ||
                          (normalizedGuess.includes(normalizedTitle) && artistInGuess) ||
                          (isSimilarEnough(normalizedGuess, normalizedTitle) && artistInGuess);

        // Check if artist was guessed correctly (but not the song)
        const artistMatch = !isCorrect && artistInGuess;

        const newGuesses = [...guesses, { text: guess, correct: isCorrect, artistMatch }];
        setGuesses(newGuesses);

        // Check if this song has already been played (for stats purposes)
        const songKey = `${currentSong.title} - ${currentSong.artist}`;
        const alreadyPlayed = stats.songStats[songKey]?.completed || stats.songStats[songKey]?.failed;

        if (isCorrect) {
          setGameWon(true);
          stopAllAudio();
          clearGameState(); // Clear saved game state on win
          if (!alreadyPlayed) {
            recordWin(currentSong, newGuesses.length);
          }
          if (!audioUnlocked) {
            setAudioUnlocked(true);
          }
          // Trigger confetti for A+ (first guess win)
          if (newGuesses.length === 1) {
            setTimeout(triggerConfetti, 100);
          }
        } else if (newGuesses.length >= MAX_GUESSES) {
          setGameLost(true);
          stopAllAudio();
          clearGameState(); // Clear saved game state on loss
          if (!alreadyPlayed) {
            recordLoss(currentSong);
          }
          setAudioUnlocked(true);
        } else {
          // Save game state for incomplete games (prevent reload exploit)
          saveGameState({
            songTitle: currentSong.title,
            songArtist: currentSong.artist,
            guesses: newGuesses
          });
          
          if (newGuesses.length >= GUESSES_BEFORE_AUDIO) {
            setAudioUnlocked(true);
          }
        }

        setGuess('');
        setSuggestions([]);
        setShowSuggestions(false);
        setViewingGuessIndex(null); // Reset to current view
      };

      const handleSkip = async () => {
        if (gameWon || gameLost) return;

        const newGuesses = [...guesses, { text: '(Skipped)', correct: false, artistMatch: false, skipped: true }];
        setGuesses(newGuesses);

        // Check if this song has already been played (for stats purposes)
        const songKey = `${currentSong.title} - ${currentSong.artist}`;
        const alreadyPlayed = stats.songStats[songKey]?.completed || stats.songStats[songKey]?.failed;

        if (newGuesses.length >= MAX_GUESSES) {
          setGameLost(true);
          stopAllAudio();
          clearGameState(); // Clear saved game state on loss
          if (!alreadyPlayed) {
            recordLoss(currentSong);
          }
          setAudioUnlocked(true);
        } else {
          // Save game state for incomplete games (prevent reload exploit)
          saveGameState({
            songTitle: currentSong.title,
            songArtist: currentSong.artist,
            guesses: newGuesses
          });
          
          if (newGuesses.length >= GUESSES_BEFORE_AUDIO) {
            setAudioUnlocked(true);
          }
        }

        setGuess('');
        setSuggestions([]);
        setShowSuggestions(false);
      };

      const toggleYouTubeAudio = () => {
        if (!ytPlayer || !playerReady) {
          console.log('YouTube player not ready yet');
          return;
        }

        try {
          if (isPlaying) {
            ytPlayer.pauseVideo();
            setIsPlaying(false);
          } else {
            ytPlayer.playVideo();
            setIsPlaying(true);
          }
        } catch (error) {
          console.error('Error controlling YouTube player:', error);
          setSearchError('Error playing audio. Try clicking again.');
        }
      };

      const handleVolumeChange = (e) => {
        const newVolume = parseInt(e.target.value);
        setVolume(newVolume);
        if (ytPlayer && playerReady) {
          ytPlayer.setVolume(newVolume);
        }
      };

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (!e.target.closest('.autocomplete-container')) {
            setShowSuggestions(false);
          }
        };
        
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      // Handle magnifier mouse movement
      const handleMouseMove = (e) => {
        const container = imageContainerRef.current;
        if (!container) return;
        
        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        setMagnifierPos({ x, y });
        
        // Calculate background position for the magnified view
        const bgX = (x / rect.width) * 100;
        const bgY = (y / rect.height) * 100;
        setMagnifierBg({ x: bgX, y: bgY });
      };

      // Render the visual hint (static image, video, or YouTube embed on win/loss)
      const renderVisualHint = () => {
        if (!currentSong) return null;

        // On win or loss, show YouTube embed with timestamp
        if ((gameWon || gameLost) && currentSong.youtubeId) {
          const timestamp = currentSong.youtubeTimestamp || 0;
          return (
            <div className="relative w-full" style={{ paddingBottom: '100%' }}>
              <iframe
                className="absolute top-0 left-0 w-full h-full"
                src={`https://www.youtube.com/embed/${currentSong.youtubeId}?autoplay=1&start=${timestamp}`}
                title={`${currentSong.title} by ${currentSong.artist}`}
                frameBorder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowFullScreen
              ></iframe>
            </div>
          );
        }

        // Determine which hint to show based on guess count and toggle
        const shouldShowVideo = guesses.length >= GUESSES_BEFORE_VIDEO && !showPictureOverVideo;
        
        // Show video if we have enough guesses and not toggled to picture
        if (shouldShowVideo) {
          return (
            <div className="relative w-full">

              <div className="absolute bottom-3 left-3 px-3 py-2 bg-black/60 text-white text-sm font-semibold rounded-lg">

              >
                <Image className="w-4 h-4" />
                Show Artwork
              </button>
            </div>
          );
        }

        // Show static image with magnifier (and toggle button if video is available)
        const isTouch = isTouchDevice();
        return (
          <div 
            ref={imageContainerRef}
            className={`relative w-full ${!isTouch ? 'cursor-crosshair' : ''}`}
            onMouseEnter={() => !isTouch && setShowMagnifier(true)}
            onMouseLeave={() => !isTouch && setShowMagnifier(false)}
            onMouseMove={(e) => {
              if (!isTouch) {
                if (!showMagnifier) setShowMagnifier(true);
                handleMouseMove(e);
              }
            }}
          >
            <img
              src={currentSong.image}
              alt="Song hint"
              className="w-full h-auto object-contain"
              draggable="false"
            />
            {showMagnifier && !isTouch && (
              <div
                className="absolute pointer-events-none border-4 border-white shadow-lg rounded-full"
                style={{
                  width: MAGNIFIER_SIZE,
                  height: MAGNIFIER_SIZE,
                  left: magnifierPos.x - MAGNIFIER_SIZE / 2,
                  top: magnifierPos.y - MAGNIFIER_SIZE / 2,
                  backgroundImage: `url(${currentSong.image})`,
                  backgroundSize: `${imageContainerRef.current?.offsetWidth * ZOOM_LEVEL}px ${imageContainerRef.current?.offsetHeight * ZOOM_LEVEL}px`,
                  backgroundPosition: `${-magnifierPos.x * ZOOM_LEVEL + MAGNIFIER_SIZE / 2}px ${-magnifierPos.y * ZOOM_LEVEL + MAGNIFIER_SIZE / 2}px`,
                  backgroundRepeat: 'no-repeat',
                }}
              />
            )}
            {/* Hint #1 label - only shows once video is unlocked */}
            {!gameWon && !gameLost && guesses.length >= GUESSES_BEFORE_VIDEO && (
              <div className="absolute bottom-3 left-3 px-3 py-2 bg-black/60 text-white text-sm font-semibold rounded-lg pointer-events-none">
                Hint #1
              </div>
            )}
            {guesses.length >= GUESSES_BEFORE_VIDEO && showPictureOverVideo && (
              <button
                onClick={() => setShowPictureOverVideo(false)}
                className="absolute bottom-3 right-3 px-3 py-2 bg-black/60 hover:bg-black/80 text-white text-sm font-semibold rounded-lg transition-colors flex items-center gap-2 pointer-events-auto"
              >
                <Video className="w-4 h-4" />
                Show Video
              </button>
            )}
          </div>
        );
      };

      // Render iTunes preview player
      const renderItunesPlayer = () => {
        const PREVIEW_DURATION = 10; // seconds before fade out
        const FADE_DURATION = 2; // seconds for fade out
        
        const handleItunesVolumeChange = (e) => {
          const newVolume = parseInt(e.target.value);
          setItunesVolume(newVolume);
          if (itunesAudioRef.current) {
            itunesAudioRef.current.volume = newVolume / 100;
          }
        };
        
        const toggleItunesPlayback = () => {
          if (!itunesAudioRef.current) return;
          
          if (isPlaying) {
            itunesAudioRef.current.pause();
            setIsPlaying(false);
          } else {
            // Reset volume to current slider value when starting
            itunesAudioRef.current.volume = itunesVolume / 100;
            itunesAudioRef.current.play();
            setIsPlaying(true);
            
            // Set up auto-stop with fade out
            const startTime = itunesAudioRef.current.currentTime;
            const targetVolume = itunesVolume / 100;
            
            const checkTime = setInterval(() => {
              if (!itunesAudioRef.current || itunesAudioRef.current.paused) {
                clearInterval(checkTime);
                return;
              }
              
              const elapsed = itunesAudioRef.current.currentTime - startTime;
              
              // Start fading when we hit the preview duration
              if (elapsed >= PREVIEW_DURATION) {
                const fadeElapsed = elapsed - PREVIEW_DURATION;
                const fadeProgress = Math.min(fadeElapsed / FADE_DURATION, 1);
                const newVol = targetVolume * (1 - fadeProgress);
                itunesAudioRef.current.volume = Math.max(0, newVol);
                
                // Stop when fade is complete
                if (fadeProgress >= 1) {
                  itunesAudioRef.current.pause();
                  itunesAudioRef.current.currentTime = 0;
                  itunesAudioRef.current.volume = targetVolume; // Reset volume for next play
                  setIsPlaying(false);
                  clearInterval(checkTime);
                }
              }
            }, 50);
          }
        };
        
        return (
          <div className="w-full px-4 py-3 sm:py-4 rounded-lg bg-gradient-to-br from-green-600 to-teal-600 text-white">
            <audio
              ref={itunesAudioRef}
              src={itunesPreviewUrl}
              onLoadedData={() => {
                if (itunesAudioRef.current) {
                  itunesAudioRef.current.volume = itunesVolume / 100;
                }
              }}
              onPlay={() => setIsPlaying(true)}
              onPause={() => setIsPlaying(false)}
              onEnded={() => setIsPlaying(false)}
              onError={() => {
                console.warn('iTunes audio failed to load, falling back to YouTube');
                setItunesError(true);
              }}
              preload="auto"
            />
            {/* Compact horizontal layout for desktop */}
            <div className="hidden sm:flex items-center gap-4">
              <Music className={`w-8 h-8 flex-shrink-0 ${isPlaying ? 'animate-pulse' : ''}`} />
              <div className="flex-1">
                <h3 className="text-sm font-bold">Audio Hint ({PREVIEW_DURATION}s Preview)</h3>
                <p className="text-xs opacity-90">
                  {isPlaying ? 'Now playing...' : 'Click to play preview'}
                </p>
              </div>
              <button
                onClick={toggleItunesPlayback}
                className="px-4 py-2 rounded-lg font-semibold transition-all bg-white text-green-600 hover:bg-gray-100 text-sm flex-shrink-0"
              >
                {isPlaying ? '⏸️ Pause' : '▶️ Play'}
              </button>
              <div className="flex items-center gap-2 flex-shrink-0">
                <span className="text-xs opacity-75">🔇</span>
                <input
                  type="range"
                  min="0"
                  max="100"
                  value={itunesVolume}
                  onChange={handleItunesVolumeChange}
                  className="w-20 h-2 bg-white/30 rounded-lg appearance-none cursor-pointer"

                    const colors = getGradeColors('F');
                    return (
                      <div className={`inline-block px-6 py-3 rounded-xl ${colors.bg} border-2 ${colors.border} mb-4`}>
                        <p className="text-sm font-semibold text-gray-600 mb-1">Grade</p>
                        <p className={`text-4xl font-black ${colors.text}`}>F</p>
                      </div>
                    );
                  })()}
                  
                  <div className="flex gap-2 justify-center">
                    <button
                      onClick={startNewGame}
                      className="flex-1 max-w-[150px] px-4 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 font-semibold transition-colors flex items-center justify-center gap-2"
                    >
                      <ArrowRight className="w-4 h-4" />
                      Next Game
                    </button>
                    <button
                      onClick={() => setGameMode('archive')}
                      className="flex-1 max-w-[150px] px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold transition-colors flex items-center justify-center gap-2"
                    >
                      <Archive className="w-4 h-4" />
                      Archive
                    </button>
                  </div>
                </div>
              )}
              
              <div className="flex items-center justify-between mb-2">
                <div className="text-xs text-gray-600">
                  {MAX_GUESSES - guesses.length} {MAX_GUESSES - guesses.length === 1 ? 'guess' : 'guesses'} remaining
                </div>
                {guesses.length >= GUESSES_BEFORE_VIDEO && !audioUnlocked && (
                  <div className="text-xs text-blue-600 font-semibold">
                    🎬 Video Unlocked!
                  </div>
                )}
                {audioUnlocked && (
                  <div className="text-xs text-green-600 font-semibold">
                    🎵 Hint #6 Unlocked!
                  </div>
                )}
              </div>

              {/* Audio player section (Hint #6) - show during gameplay after 5 guesses, hide on win/loss */}
              {audioUnlocked && guesses.length >= GUESSES_BEFORE_AUDIO && !gameWon && !gameLost && (
                <div className="mb-3 flex flex-col gap-2">
                  <div className="bg-gray-50 rounded-lg p-2 border border-gray-200">
                    <span className="inline-block px-2 py-1 mb-2 bg-gray-600 text-white rounded text-xs font-bold">Hint #6</span>
                    <div className="w-full">
                      {itunesPreviewUrl && !itunesError ? (
                        // iTunes Preview (primary)
                        itunesLoading ? (
                          <div className="w-full px-4 py-4 rounded-lg bg-gradient-to-br from-green-600 to-teal-600 text-white text-center">
                            <Music className="w-8 h-8 mx-auto mb-2 animate-pulse" />
                            <p className="text-sm">Loading audio preview...</p>
                          </div>
                        ) : (
                          renderItunesPlayer()
                        )
                      ) : currentSong?.youtubeId ? (
                        // YouTube fallback
                        renderYouTubePlayer()
                      ) : (
                        <div className="w-full px-4 py-3 rounded-lg bg-yellow-100 text-yellow-800 text-sm">
                          <p className="font-semibold mb-1">🎵 No Audio Available</p>
                          <p className="text-xs">Keep guessing based on the visual hints!</p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {!gameWon && !gameLost && (
                <>
                  <div className="mb-3 autocomplete-container relative">
                    <div className="relative">
                      <input
                        type="text"
                        value={guess}
                        onChange={handleInputChange}
                        onKeyPress={(e) => {
                          if (e.key === 'Enter') {
                            handleGuess();
                            setShowSuggestions(false);
                          }
                        }}
                        onFocus={() => guess.length >= 2 && setShowSuggestions(true)}
                        placeholder="Enter song title or artist..."
                        className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none text-sm"
                        autoComplete="off"
                      />
                      {showSuggestions && suggestions.length > 0 && (
                        <div className="absolute z-10 w-full mt-1 bg-white border-2 border-gray-300 rounded-lg shadow-lg max-h-48 overflow-y-auto">
                          {suggestions.map((suggestion, idx) => (
                            <div
                              key={idx}
                              onClick={() => selectSuggestion(suggestion)}
                              className="px-3 py-2 hover:bg-purple-50 cursor-pointer border-b border-gray-100 last:border-b-0"
                            >
                              <div className="font-semibold text-gray-800 text-sm">{suggestion.title}</div>
                              <div className="text-sm text-gray-600">{suggestion.artist}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                  <div className="flex gap-2 mb-4">
                    <button
                      onClick={handleSkip}
                      className="flex-1 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-semibold transition-colors text-sm"
                    >
                      Skip
                    </button>
                    <button
                      onClick={() => {
                        handleGuess();
                        setShowSuggestions(false);
                      }}
                      className="flex-1 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-semibold transition-colors text-sm"
                    >
                      Guess
                    </button>
                  </div>
                </>
              )}

              {guesses.length > 0 && (
                <div className="mt-4">
                  <h3 className="font-semibold text-gray-700 mb-1.5 text-sm">Your Guesses:</h3>
                  <div className="space-y-1.5">
                    {guesses.map((g, idx) => (
                      <div
                        key={idx}
                        className={`flex items-center gap-2 p-2 rounded-lg text-sm ${
                          g.correct ? 'bg-green-100 border-2 border-green-500' : 'bg-gray-100'
                        }`}
                      >
                        {g.correct ? (
                          <CheckCircle className="w-4 h-4 text-green-600 flex-shrink-0" />
                        ) : (
                          <XCircle className="w-4 h-4 text-red-500 flex-shrink-0" />
                        )}
                        <span className={g.correct ? 'text-green-800 font-semibold' : 'text-gray-700'}>
                          {g.text}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
            )}

            {gameMode === 'play' && (
            <div className="text-center text-purple-200 text-xs space-y-0.5">
              <p>After {GUESSES_BEFORE_AUDIO} guesses, unlock audio hint!</p>
              <p className="text-xs">Video unlocks after {GUESSES_BEFORE_VIDEO} guess</p>
              {playedSongs.length > 0 && (
                <p className="text-xs mt-1">
                  Songs played: {playedSongs.length}/{SONGS.length}
                  {playedSongs.length === SONGS.length && " - Starting fresh next round!"}
                </p>
              )}
            </div>
            )}

            {/* HOW TO PLAY MODAL */}
            {showHowToPlay && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={() => setShowHowToPlay(false)}>
                <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-6 sm:p-8" onClick={(e) => e.stopPropagation()}>
                  <div className="flex items-center justify-between mb-4">
                    <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                      <Lightbulb className="w-6 h-6 text-yellow-500" />
                      How To Play
                    </h2>
                    <button
                      onClick={() => setShowHowToPlay(false)}
                      className="p-1 hover:bg-gray-100 rounded-full transition-colors"
                    >
                      <XCircle className="w-6 h-6 text-gray-400" />
                    </button>
                  </div>
                  <div className="space-y-4 text-gray-700 text-sm leading-relaxed">
                    <p className="text-base font-semibold text-purple-700">Guess the song from its visual hints!</p>
                    <div>
                      <h3 className="font-bold text-gray-800 mb-1">🎨 The Image</h3>
                      <p>Each game starts with an original art piece inspired by a song. Study the image for clues about the song's title, lyrics, or theme. Some clues can be subtly hidden within the image, so feel free to zoom in to spot them!</p>
                    </div>
                    <div>
                      <h3 className="font-bold text-gray-800 mb-1">🔍 Guessing</h3>
                      <p>Type your guess in the text box — you can search by song title or artist name. You have a limited number of guesses, so choose wisely! You can also skip a guess if you're stuck.</p>
                    </div>
                    <div>
                      <h3 className="font-bold text-gray-800 mb-1">💡 Progressive Hints</h3>
                      <p>With each wrong guess or skip, a new hint is revealed to help you narrow it down:</p>
                      <ul className="list-disc list-inside mt-1 space-y-0.5 text-gray-600">
                        <li><span className="font-semibold text-gray-700">Hint #1:</span> Animated Art</li>
                        <li><span className="font-semibold text-gray-700">Hint #2:</span> Text Hint</li>
                        <li><span className="font-semibold text-gray-700">Hint #3:</span> Genre / Lyric #1</li>
                        <li><span className="font-semibold text-gray-700">Hint #4:</span> Release Year / Lyric #2</li>
                        <li><span className="font-semibold text-gray-700">Hint #5:</span> Artist</li>
                        <li><span className="font-semibold text-gray-700">Hint #6:</span> Audio preview</li>
                      </ul>
                    </div>
                    <div>
                      <h3 className="font-bold text-gray-800 mb-1">🎬 Video Hint</h3>
                      <p>After your first guess/skip, a short animated video hint is unlocked — it may contain additional visual clues!</p>
                    </div>
                    <div>
                      <h3 className="font-bold text-gray-800 mb-1">📅 Daily Unlock</h3>
                      <p>A new song is added every day. Come back daily for a fresh challenge!</p>
                    </div>
                    <div>
                      <h3 className="font-bold text-gray-800 mb-1">📊 Stats</h3>
                      <p>Track your performance over time — see your win rate, guess distribution, and current streak from the Stats page.</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowHowToPlay(false)}
                    className="w-full mt-6 px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg hover:from-purple-700 hover:to-pink-700 font-semibold transition-all text-lg"
                  >
                    Got It!
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.render(<SongArtGame />, document.getElementById('root'));
  </script>
</body>
</html>
