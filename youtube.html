<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Video</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .err { color: #fff; font-family: sans-serif; padding: 1em; }
  </style>
</head>
<body>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var v = params.get('v');
      var start = params.get('start') || '0';
      var autoplay = params.get('autoplay') || '1';
      if (!v) {
        document.body.innerHTML = '<p class="err">No video ID provided.</p>';
        return;
      }
      var url = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v)
        + '?autoplay=' + encodeURIComponent(autoplay)
        + '&playsinline=1'
        + '&start=' + encodeURIComponent(start)
        + '&rel=0'
        + '&modestbranding=1'
        + '&origin=' + encodeURIComponent(location.origin);
      var iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.referrerPolicy = 'strict-origin-when-cross-origin';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      iframe.allowFullscreen = true;
      document.body.appendChild(iframe);
    })();
  </script>
</body>
</html>
